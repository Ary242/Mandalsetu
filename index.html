<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#B7410E">
<title>MandalSetu | मंडळसेतू</title>
<style>
/* ========================================================================
   MandalSetu — Design Tokens
   Palette drawn from Ganeshotsav visual language:
   - Shendur/sindoor red-orange (idol pigment) as primary
   - Deep peacock teal as secondary (traditional mandap drapery)
   - Old brass/gold for financial emphasis
   - Warm turmeric cream as the paper-like base surface
   ======================================================================== */
:root{
  --shendur:#C8500F;
  --shendur-dark:#9E3D09;
  --shendur-light:#F0824A;
  --peacock:#0D5C63;
  --peacock-dark:#083F44;
  --brass:#B8860B;
  --brass-light:#E0AC3B;
  --cream:#FBF3E7;
  --cream-2:#F3E6D0;
  --paper:#FFFDF8;
  --ink:#2A1B12;
  --ink-soft:#5B4636;
  --line:#E4D3B8;
  --ok:#2E7D4F;
  --ok-bg:#E4F3E9;
  --danger:#B23A2E;
  --danger-bg:#FBE7E3;
  --warn:#B8860B;
  --warn-bg:#FBF0DA;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow-1:0 1px 3px rgba(42,27,18,.08), 0 1px 2px rgba(42,27,18,.06);
  --shadow-2:0 8px 24px rgba(42,27,18,.12);
  --font-display: "Poppins","Segoe UI",Roboto,system-ui,sans-serif;
  --font-body: "Segoe UI",Roboto,"Noto Sans",system-ui,-apple-system,sans-serif;
  --font-mono: "Consolas","Menlo",monospace;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --shendur:#E27A3F;
  --shendur-dark:#B7592A;
  --shendur-light:#F4A26C;
  --peacock:#3AA6A0;
  --peacock-dark:#1D7A76;
  --brass:#E0AC3B;
  --brass-light:#F0C868;
  --cream:#1B140F;
  --cream-2:#241B14;
  --paper:#221A14;
  --ink:#F3E9DC;
  --ink-soft:#C9B8A4;
  --line:#3A2C20;
  --ok:#5FD18B;
  --ok-bg:#173322;
  --danger:#F0776A;
  --danger-bg:#3A1D18;
  --warn:#F0C868;
  --warn-bg:#332815;
  --shadow-1:0 1px 3px rgba(0,0,0,.35);
  --shadow-2:0 10px 28px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.2px;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--shendur-light);color:#fff;}
a{color:inherit;}

/* subtle modak/rangoli dot texture on cream background */
.bg-texture{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(circle at 12% 8%, var(--cream-2) 0 2px, transparent 2px),
    radial-gradient(circle at 68% 22%, var(--cream-2) 0 2px, transparent 2px),
    radial-gradient(circle at 40% 60%, var(--cream-2) 0 2px, transparent 2px),
    radial-gradient(circle at 88% 78%, var(--cream-2) 0 2px, transparent 2px);
  background-size:120px 120px;
}

#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Top App Bar ---------- */
.appbar{
  position:sticky;top:0;z-index:40;
  padding:calc(14px + var(--safe-top)) 16px 14px;
  background:linear-gradient(135deg,var(--shendur-dark),var(--shendur));
  color:#fff;
  box-shadow:var(--shadow-1);
  display:flex;align-items:center;gap:12px;
}
.appbar h1{font-size:18px;font-weight:700;}
.appbar .sub{font-size:11.5px;opacity:.85;margin-top:1px;}
.appbar .spacer{flex:1;}
.appbar-btn{
  background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;
}
.appbar-btn:active{background:rgba(255,255,255,.3);}
.modak-icon{font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}

/* ---------- Screens ---------- */
.screens{flex:1;padding:14px 14px calc(96px + var(--safe-bottom));}
.screen{display:none;animation:fadeUp .22s ease;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Cards ---------- */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:16px;box-shadow:var(--shadow-1);margin-bottom:12px;
}
.card-title{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}

/* ---------- Dashboard stat grid ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{
  border-radius:var(--radius-m);padding:14px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow-1);min-height:92px;display:flex;flex-direction:column;justify-content:space-between;
}
.stat-card .label{font-size:11.5px;opacity:.92;font-weight:600;}
.stat-card .value{font-size:20px;font-weight:800;font-family:var(--font-display);}
.stat-card.collect{background:linear-gradient(135deg,var(--peacock-dark),var(--peacock));}
.stat-card.expense{background:linear-gradient(135deg,#8C3A2A,var(--shendur));}
.stat-card.balance{background:linear-gradient(135deg,#8A6A00,var(--brass));}
.stat-card.pending{background:linear-gradient(135deg,#5B4636,#8A6A55);}
.stat-card .icon{position:absolute;right:8px;top:8px;font-size:26px;opacity:.35;}

.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.mini-stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px;text-align:center;}
.mini-stat .n{font-size:17px;font-weight:800;color:var(--shendur-dark);}
.mini-stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.qa-btn{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow-1);
  font-weight:700;font-size:12.5px;color:var(--ink);
}
.qa-btn .qi{font-size:22px;}
.qa-btn:active{transform:scale(.97);}

/* ---------- Section header ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
.section-head h2{font-size:16px;}
.section-head .link{font-size:12.5px;color:var(--shendur-dark);font-weight:700;cursor:pointer;}

/* ---------- List rows ---------- */
.list-row{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:12px;margin-bottom:8px;cursor:pointer;
}
.list-row:active{background:var(--cream-2);}
.row-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--cream-2);color:var(--shendur-dark);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;
  border:1px solid var(--line);
}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-end{text-align:right;flex-shrink:0;}
.row-amt{font-weight:800;font-size:14.5px;color:var(--ok);}
.row-amt.neg{color:var(--danger);}
.row-time{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.3px;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.danger{background:var(--danger-bg);color:var(--danger);}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.badge.info{background:var(--cream-2);color:var(--ink-soft);}

/* ---------- Empty states ---------- */
.empty-state{text-align:center;padding:44px 20px;color:var(--ink-soft);}
.empty-state .ei{font-size:40px;margin-bottom:10px;opacity:.6;}
.empty-state .et{font-weight:700;color:var(--ink);margin-bottom:4px;}
.empty-state .es{font-size:13px;margin-bottom:16px;}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:var(--radius-s);padding:13px 18px;font-weight:700;font-size:14.5px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .1s ease;width:100%;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--shendur-dark),var(--shendur));color:#fff;box-shadow:0 4px 12px rgba(200,80,15,.3);}
.btn-secondary{background:var(--paper);color:var(--peacock-dark);border:1.5px solid var(--peacock);}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid var(--danger);}
.btn-brass{background:linear-gradient(135deg,#8A6A00,var(--brass));color:#fff;}
.btn-sm{padding:8px 12px;font-size:12.5px;width:auto;}
.btn-block-row{display:flex;gap:10px;}
.btn-block-row .btn{flex:1;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.fab{
  position:fixed;z-index:35;right:calc(50% - 264px);bottom:calc(88px + var(--safe-bottom));
  width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--shendur-dark),var(--shendur));
  color:#fff;font-size:26px;border:none;box-shadow:0 6px 18px rgba(200,80,15,.45);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
@media(max-width:600px){.fab{right:18px;}}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.field .err{font-size:11.5px;color:var(--danger);margin-top:4px;font-weight:600;display:none;}
.field.invalid .err{display:block;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)!important;}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=time],input[type=password],select,textarea{
  width:100%;padding:12px 13px;border-radius:var(--radius-s);border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:14.5px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--shendur);}
textarea{resize:vertical;min-height:70px;}
.seg{display:flex;background:var(--cream-2);border-radius:var(--radius-s);padding:4px;gap:4px;}
.seg button{flex:1;border:none;background:transparent;padding:10px 6px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;}
.seg button.active{background:var(--paper);color:var(--shendur-dark);box-shadow:var(--shadow-1);}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.chip.active{background:var(--shendur);border-color:var(--shendur);color:#fff;}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:22px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--shendur);background:transparent;}
.pin-dot.filled{background:var(--shendur);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto;}
.pin-key{padding:18px;border-radius:16px;background:var(--paper);border:1px solid var(--line);font-size:20px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-1);}
.pin-key:active{background:var(--cream-2);}
.pin-key.fn{background:transparent;box-shadow:none;border:none;color:var(--ink-soft);}

/* ---------- Bottom Nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;max-width:560px;margin:0 auto;
  background:var(--paper);border-top:1px solid var(--line);
  display:flex;padding:6px 2px calc(6px + var(--safe-bottom));
  box-shadow:0 -4px 16px rgba(0,0,0,.06);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:none;background:transparent;cursor:pointer;color:var(--ink-soft);}
.nav-item .ni{font-size:19px;}
.nav-item .nl{font-size:9.5px;font-weight:700;}
.nav-item.active{color:var(--shendur-dark);}
.nav-item.active .ni{transform:translateY(-1px);}

/* ---------- Modal / Sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,12,6,.5);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.overlay.active{display:flex;}
.sheet{
  background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:18px 16px calc(20px + var(--safe-bottom));
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-head h3{font-size:16.5px;}
.sheet-close{background:var(--cream-2);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink-soft);}

.overlay.center{align-items:center;padding:20px;}
.dialog{background:var(--paper);border-radius:var(--radius-l);padding:22px;max-width:400px;width:100%;box-shadow:var(--shadow-2);animation:popIn .2s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
.dialog h3{font-size:16.5px;margin-bottom:8px;}
.dialog p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
.dialog .dicon{font-size:34px;margin-bottom:10px;}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;top:calc(10px + var(--safe-top));left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:var(--shadow-2);animation:toastIn .25s ease;max-width:88%;text-align:center;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--ok);}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Misc ---------- */
.hr{height:1px;background:var(--line);margin:14px 0;}
.muted{color:var(--ink-soft);font-size:12.5px;}
.right{text-align:right;}
.center{text-align:center;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.receipt-paper{
  background:var(--paper);border:1px dashed var(--brass);border-radius:var(--radius-m);padding:20px;
  font-family:var(--font-mono);position:relative;
}
.receipt-paper .rtitle{text-align:center;font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--shendur-dark);}
.receipt-paper .rsub{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;}
.receipt-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);}
.receipt-row .k{color:var(--ink-soft);}
.receipt-amt{text-align:center;font-size:26px;font-weight:800;color:var(--ok);margin:14px 0;font-family:var(--font-display);}
.watermark-stamp{
  position:absolute;top:14px;right:14px;border:3px solid var(--danger);color:var(--danger);
  padding:4px 10px;font-weight:800;font-size:13px;border-radius:6px;transform:rotate(12deg);opacity:.85;
}
.edited-flag{color:var(--warn);font-size:11px;font-weight:800;}
.audit-item{border-left:3px solid var(--peacock);padding:6px 0 6px 12px;margin-bottom:8px;}
.audit-item .a-action{font-weight:700;font-size:13px;}
.audit-item .a-meta{font-size:11px;color:var(--ink-soft);}
.diff-box{background:var(--cream-2);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:6px;}
.diff-box .old{color:var(--danger);text-decoration:line-through;}
.diff-box .new{color:var(--ok);font-weight:700;}

.lock-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--shendur-dark),var(--peacock-dark));z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;}
.lock-screen .li{font-size:52px;margin-bottom:6px;}
.lock-screen h2{font-size:20px;margin-bottom:2px;}
.lock-screen .sub{opacity:.85;font-size:13px;margin-bottom:6px;}
.lock-screen .pin-dot{border-color:#fff;}
.lock-screen .pin-dot.filled{background:#fff;}
.lock-screen .pin-key{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;}
.lock-screen .pin-key.fn{color:rgba(255,255,255,.8);}

.switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:30px;transition:.2s;}
.switch .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--shendur);}
.switch input:checked + .slider:before{transform:translateX(18px);}

.settings-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.settings-row:last-child{border-bottom:none;}
.settings-row .si{font-size:19px;width:26px;text-align:center;}
.settings-row .st{flex:1;font-weight:600;font-size:14px;}
.settings-row .ss{font-size:11.5px;color:var(--ink-soft);}
.settings-row .sarrow{color:var(--ink-soft);}

table.report-table{width:100%;border-collapse:collapse;font-size:12px;}
table.report-table th{background:var(--cream-2);padding:8px 6px;text-align:left;font-size:11px;color:var(--ink-soft);}
table.report-table td{padding:8px 6px;border-bottom:1px solid var(--line);}

.role-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;background:var(--cream-2);color:var(--shendur-dark);border:1px solid var(--line);}

.loading-screen{position:fixed;inset:0;background:var(--cream);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.loading-screen .lg{font-size:60px;animation:spinSlow 2.4s linear infinite;}
@keyframes spinSlow{from{transform:rotate(0);}to{transform:rotate(360deg);}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:12px;}
.search-bar input{border:none;padding:0;flex:1;background:transparent;}
.search-bar .sic{color:var(--ink-soft);}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.filter-row::-webkit-scrollbar{display:none;}

/* ---------------------------- Calculator ---------------------------- */
.calc-dialog{max-width:380px;width:100%;padding:0;overflow:hidden;}
.calc-header{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  background:linear-gradient(135deg,var(--peacock-dark),var(--peacock));color:#fff;font-weight:700;font-size:14.5px;
}
.calc-screen{padding:18px 16px 10px;text-align:right;background:var(--paper);}
.calc-expr{font-size:13px;color:var(--ink-soft);min-height:18px;font-family:var(--font-mono);}
.calc-display{font-size:34px;font-weight:800;font-family:var(--font-display);color:var(--ink);word-break:break-all;}
.calc-history-panel{max-height:110px;overflow-y:auto;background:var(--cream-2);padding:6px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.calc-hist-row{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;color:var(--ink-soft);font-family:var(--font-mono);}
.calc-hist-row .ch-res{font-weight:700;color:var(--ink);}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);}
.calc-btn{
  border:none;background:var(--paper);color:var(--ink);font-size:19px;font-weight:700;padding:16px 0;cursor:pointer;
}
.calc-btn:active{background:var(--cream-2);}

/* ---------------------------- IndexedDB LAYER ---------------------------- */
function openDatabase(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('mandal')) db.createObjectStore('mandal',{keyPath:'id'});
      if(!db.objectStoreNames.contains('users')) db.createObjectStore('users',{keyPath:'id'});
      if(!db.objectStoreNames.contains('members')) db.createObjectStore('members',{keyPath:'id'});
      if(!db.objectStoreNames.contains('receipts')){
        const s = db.createObjectStore('receipts',{keyPath:'id'});
        s.createIndex('receiptNo','receiptNo',{unique:true});
        s.createIndex('donorName','donorName',{unique:false});
        s.createIndex('mobile','mobile',{unique:false});
      }
      if(!db.objectStoreNames.contains('expenses')){
        const s = db.createObjectStore('expenses',{keyPath:'id'});
        s.createIndex('expenseCode','expenseCode',{unique:true});
      }
      if(!db.objectStoreNames.contains('events')) db.createObjectStore('events',{keyPath:'id'});
      if(!db.objectStoreNames.contains('auditLogs')) db.createObjectStore('auditLogs',{keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'id'});
      if(!db.objectStoreNames.contains('calcHistory')){
        const s = db.createObjectStore('calcHistory',{keyPath:'id'});
        s.createIndex('ts','ts',{unique:false});
      }
    };
    req.onsuccess = (e)=>resolve(e.target.result);
    req.onerror = (e)=>reject(e.target.error);
  });
}
function tx(storeName, mode='readonly'){
  return STATE.db.transaction(storeName, mode).objectStore(storeName);
}
function dbGetAll(storeName){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName).getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);
  });
}
function dbGet(storeName, id){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName).get(id);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
function dbPut(storeName, obj){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,'readwrite').put(obj);
    req.onsuccess = ()=>resolve(obj);
    req.onerror = ()=>reject(req.error);
  });
}
function dbDelete(storeName, id){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,'readwrite').delete(id);
    req.onsuccess = ()=>resolve(true);
    req.onerror = ()=>reject(req.error);
  });
}
function dbClear(storeName){
  return new Promise((resolve,reject)=>{
    const req = tx(storeName,'readwrite').clear();
    req.onsuccess = ()=>resolve(true);
    req.onerror = ()=>reject(req.error);
  });
}

/* ---------------------------- UTILS ---------------------------- */
function uid(prefix){
  return (prefix?prefix+'_':'') + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
}
function fmtCurrency(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  let s = n.toFixed(0);
  // Indian digit grouping
  let lastThree = s.substring(s.length-3);
  let other = s.substring(0, s.length-3);
  if(other !== '') lastThree = ',' + lastThree;
  const formatted = other.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
  return (neg?'-':'') + '₹' + formatted;
}
function fmtDate(d){
  if(!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt)) return d;
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${dt.getFullYear()}`;
}
function fmtTime(t){
  if(!t) return '';
  return t;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function nowStamp(){
  return { date: todayISO(), time: nowTimeStr(), ts: Date.now() };
}
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
}
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type?(' '+type):'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2400);
}
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function debounce(fn, ms){
  let h; return (...args)=>{ clearTimeout(h); h = setTimeout(()=>fn(...args), ms); };
}

/* ---------------------------- RECEIPT / EXPENSE NUMBERING ---------------------------- */
function nextReceiptNumber(){
  const year = STATE.mandal ? STATE.mandal.year : new Date().getFullYear();
  const existing = STATE.cache.receipts.filter(r => r.receiptNo && r.receiptNo.includes('GM-'+year+'-'));
  let max = 0;
  existing.forEach(r=>{
    const parts = r.receiptNo.split('-');
    const n = parseInt(parts[parts.length-1], 10);
    if(!isNaN(n) && n>max) max = n;
  });
  const next = max + 1;
  return 'GM-'+year+'-'+String(next).padStart(4,'0');
}
function nextExpenseCode(){
  const year = STATE.mandal ? STATE.mandal.year : new Date().getFullYear();
  const existing = STATE.cache.expenses.filter(e => e.expenseCode && e.expenseCode.includes('EX-'+year+'-'));
  let max = 0;
  existing.forEach(e=>{
    const parts = e.expenseCode.split('-');
    const n = parseInt(parts[parts.length-1], 10);
    if(!isNaN(n) && n>max) max = n;
  });

  return 'EX-'+year+'-'+String(next).padStart(4,'0');
}

/* ---------------------------- FINANCIAL CALCULATIONS ---------------------------- */
function calcTotals(){
  const validReceipts = STATE.cache.receipts.filter(r=>r.status!=='cancelled');
  const cancelledReceipts = STATE.cache.receipts.filter(r=>r.status==='cancelled');
  const validExpenses = STATE.cache.expenses.filter(e=>e.status!=='cancelled');
  const cancelledExpenses = STATE.cache.expenses.filter(e=>e.status==='cancelled');
  const totalCollected = validReceipts.reduce((s,r)=>s+Number(r.amount||0),0);
  const totalExpenses = validExpenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const balance = totalCollected - totalExpenses;
  const pending = STATE.mandal && STATE.mandal.pledgedTotal ? Math.max(0, Number(STATE.mandal.pledgedTotal) - totalCollected) : 0;
  return {
    totalCollected, totalExpenses, balance, pending,
    validReceipts, cancelledReceipts, validExpenses, cancelledExpenses,
    receiptCount: STATE.cache.receipts.length,
    cancelledReceiptCount: cancelledReceipts.length
  };
}

/* ---------------------------- ENCRYPTION (Backup) ---------------------------- */
async function deriveKey(password, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
function bufToB64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function b64ToBuf(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr.buffer;
}
async function encryptBackup(jsonStr, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder().encode(jsonStr);
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc);
  return {
    encrypted:true, version:1,
    salt: bufToB64(salt), iv: bufToB64(iv), data: bufToB64(cipher)
  };
}
async function decryptBackup(payload, password){
  const salt = new Uint8Array(b64ToBuf(payload.salt));
  const iv = new Uint8Array(b64ToBuf(payload.iv));
  const key = await deriveKey(password, salt);
  const cipherBuf = b64ToBuf(payload.data);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipherBuf);
  return new TextDecoder().decode(plainBuf);
}

  ]);
  STATE.mandal = mandals[0] || null;
  STATE.cache.users = users;
  STATE.cache.members = members.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  STATE.cache.receipts = receipts.sort((a,b)=>(b.ts||0)-(a.ts||0));
  STATE.cache.expenses = expenses.sort((a,b)=>(b.ts||0)-(a.ts||0));
  STATE.cache.events = events.sort((a,b)=> new Date(a.date+'T'+(a.startTime||'00:00')) - new Date(b.date+'T'+(b.startTime||'00:00')));
  STATE.cache.auditLogs = auditLogs.sort((a,b)=>(b.ts||0)-(a.ts||0));
  STATE.cache.calcHistory = calcHistoryRows.sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,50);
  // NOTE: 'settings' store holds multiple rows (app-settings, security-state) —
  // always fetch by id, never assume getAll()[0] is the right row.
  const settings = await dbGet('settings','app-settings');
  if(settings){
    STATE.lang = settings.lang || 'en';
    STATE.theme = settings.theme || 'light';
    STATE.autoLockMinutes = settings.autoLockMinutes ?? 5;
  }
  const secRow = await dbGet('settings','security-state');
  STATE.security = secRow
    ? { failedAttempts: secRow.failedAttempts||0, lockoutUntil: secRow.lockoutUntil||0, lockoutStage: secRow.lockoutStage||0 }
    : { failedAttempts:0, lockoutUntil:0, lockoutStage:0 };
}

/* ---------------------------- BRUTE-FORCE PROTECTION ---------------------------- */
const LOCKOUT_BASE_SECONDS = 30;
const LOCKOUT_MAX_SECONDS = 600; // cap progressive lockout at 10 minutes
async function saveSecurityState(){
  await dbPut('settings', { id:'security-state', ...STATE.security });
}
function isLockedOut(){ return STATE.security.lockoutUntil > Date.now(); }
function lockoutRemainingSeconds(){ return Math.max(0, Math.ceil((STATE.security.lockoutUntil - Date.now())/1000)); }
async function registerFailedAttempt(){
  STATE.security.failedAttempts++;
  // Every 5th consecutive failure triggers a lockout with progressively longer duration
  if(STATE.security.failedAttempts % 5 === 0){
    STATE.security.lockoutStage++;
    const secs = Math.min(LOCKOUT_MAX_SECONDS, LOCKOUT_BASE_SECONDS * Math.pow(2, STATE.security.lockoutStage-1));
    STATE.security.lockoutUntil = Date.now() + secs*1000;
  }
  await saveSecurityState();
}
async function registerSuccessfulLogin(){
  STATE.security = { failedAttempts:0, lockoutUntil:0, lockoutStage:0 };
  await saveSecurityState();
}

async function buildBackupObject(){

}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function doBackup(password){
  const obj = await buildBackupObject();
  const json = JSON.stringify(obj);
  const dateTag = todayISO();
  let outContent, filename;
  if(password){
    const enc = await encryptBackup(json, password);
    outContent = JSON.stringify(enc);
    filename = `MandalSetu_Backup_${dateTag}.mset`;
  } else {
    outContent = JSON.stringify({encrypted:false, version:1, payload: obj});
    filename = `MandalSetu_Backup_${dateTag}.mset`;
  }
  downloadFile(filename, outContent, 'application/json');
  await logAudit('Backup created', '', {encrypted: !!password});
  return filename;
}
async function doExportAll(){
  // PART 5: raw/plain export is an advanced, President-only action, and must never leak PIN hashes.
  if(!requirePresident('export all data')) return;
  const obj = await buildBackupObject();
  const sanitized = { ...obj, users: (obj.users||[]).map(u=>({ id:u.id, name:u.name, role:u.role })) };
  downloadFile(`MandalSetu_Export_${todayISO()}.json`, JSON.stringify(sanitized, null, 2), 'application/json');
  await logAudit('Settings changed', '', {action:'Advanced data exported (President)'});
  toast('Data exported (PIN data excluded for safety)', 'ok');
}

/* Validate the shape of a decrypted/parsed backup payload BEFORE touching the database.
   Returns null if valid, or a human-readable error string if not. */
function validateBackupPayload(payload){
  if(!payload || typeof payload !== 'object') return 'This file is not a valid MandalSetu backup.';
  if(!payload.mandal || typeof payload.mandal !== 'object' || !payload.mandal.name) return 'Backup is missing mandal information.';
  const arrayFields = ['members','receipts','expenses','events','users','auditLogs'];
  for(const key of arrayFields){
    if(payload[key] !== undefined && !Array.isArray(payload[key])) return `Backup data for "${key}" is invalid or corrupted.`;
  }
  return null;
}

/* Read + decrypt + structurally validate a backup file WITHOUT modifying any existing data.
   Throws Error('PASSWORD_REQUIRED') if the file is encrypted and no password was supplied. */
async function readAndValidateBackup(fileText, password){
  let outer;
  try{ outer = JSON.parse(fileText); }
  catch(e){ throw new Error('This file is not a valid MandalSetu backup (invalid JSON).'); }
  let payload;
  if(outer.encrypted){
    if(!password) throw new Error('PASSWORD_REQUIRED');
    let plain;
    try{ plain = await decryptBackup(outer, password); }
    catch(e){ throw new Error('Incorrect password, or the backup file is corrupted.'); }
    try{ payload = JSON.parse(plain); }
    catch(e){ throw new Error('Backup content could not be read after decryption.'); }
  } else {
    payload = outer.payload || outer;
  }
  const err = validateBackupPayload(payload);
  if(err) throw new Error(err);
  return payload;
}

/* Atomic, all-store restore using a SINGLE IndexedDB transaction: either every store is
   replaced together, or (on any error) the transaction aborts and NOTHING changes. This
   guarantees existing data is never left half-cleared/half-written. */
function restoreFromPayloadAtomic(payload){
  return new Promise((resolve, reject)=>{
    const storesToUse = ['mandal','users','members','receipts','expenses','events','auditLogs'];
    let txn;
    try{ txn = STATE.db.transaction(storesToUse, 'readwrite'); }
    catch(e){ reject(e); return; }
    txn.oncomplete = ()=>resolve();
    txn.onerror = ()=>reject(txn.error || new Error('Restore failed. Your existing data has not been changed.'));
    txn.onabort = ()=>reject(txn.error || new Error('Restore failed. Your existing data has not been changed.'));
    try{
      storesToUse.forEach(s=>txn.objectStore(s).clear());
      if(payload.mandal) txn.objectStore('mandal').put(payload.mandal);
      (payload.users||[]).forEach(u=>txn.objectStore('users').put(u));
      (payload.members||[]).forEach(m=>txn.objectStore('members').put(m));
      (payload.receipts||[]).forEach(r=>txn.objectStore('receipts').put(r));
      (payload.expenses||[]).forEach(e=>txn.objectStore('expenses').put(e));
      (payload.events||[]).forEach(ev=>txn.objectStore('events').put(ev));
      (payload.auditLogs||[]).forEach(a=>txn.objectStore('auditLogs').put(a));
    }catch(e){
      try{ txn.abort(); }catch(_e){}
      reject(e);
    }
  });
}
async function restoreFromPayload(payload){
  // Safety net: if the incoming backup's user list is missing PIN hashes (e.g. a sanitized
  // President-only export), keep the CURRENT device's user accounts so nobody gets locked out.
  const usersLookComplete = payload.users && payload.users.length && payload.users.every(u=>u.pinHash);
  const effectivePayload = { ...payload, users: usersLookComplete ? payload.users : STATE.cache.users };
  await restoreFromPayloadAtomic(effectivePayload);
  if(payload.settings){
    STATE.lang = payload.settings.lang || STATE.lang;
    STATE.theme = payload.settings.theme || STATE.theme;
    STATE.autoLockMinutes = payload.settings.autoLockMinutes ?? STATE.autoLockMinutes;
    await saveSettings();
  }
  await loadAllData();
}
/* Downloads an automatic, unencrypted safety copy of the CURRENT data before a destructive
   restore proceeds — so the previous state is always recoverable even after confirming restore. */
async function createEmergencyBackup(){
  try{
    const obj = await buildBackupObject();
    downloadFile(`MandalSetu_EmergencyBackup_${todayISO()}_${Date.now()}.json`, JSON.stringify(obj), 'application/json');
    await logAudit('Backup created', '', {type:'automatic-pre-restore-safety-copy'});
  }catch(e){ console.error('Emergency backup failed', e); }
}
/* Full guarded restore: auto safety-backup -> atomic write -> audit log.
   If restoreFromPayloadAtomic throws, current data is guaranteed untouched (see above). */
async function applyRestore(payload){
  await createEmergencyBackup();
  try{
    await restoreFromPayload(payload);
  }catch(e){
    throw new Error('Restore failed. Your existing data has not been changed.');
  }
  await logAudit('Backup restored', '', {mandal: payload.mandal ? payload.mandal.name : ''});
}

/* Generic edit with history tracking, used for receipts */
async function editReceiptField(existing, updates){
  const stamp = nowStamp();
  const history = existing.editHistory ? [...existing.editHistory] : [];
  const fieldsToTrack = ['donorName','amount','mobile','address','paymentMethod','date','collectedBy','notes'];
  fieldsToTrack.forEach(f=>{
    const oldV = existing[f];
    const newV = updates[f];
    if(String(oldV??'') !== String(newV??'')){
      history.push({ field:f, oldValue: oldV ?? '', newValue: newV ?? '', user: STATE.currentUser?STATE.currentUser.name:'System', date: stamp.date, time: stamp.time });
    }
  });
  const updated = { ...existing, ...updates, edited: history.length>0 || existing.edited, editHistory: history };
  await dbPut('receipts', updated);
  const idx = STATE.cache.receipts.findIndex(x=>x.id===existing.id);
  if(idx>-1) STATE.cache.receipts[idx] = updated;
  await logAudit('Receipt edited', existing.id, {fields: history.map(h=>h.field)});
  return updated;
}

      history.push({ field:f, oldValue: oldV ?? '', newValue: newV ?? '', user: STATE.currentUser?STATE.currentUser.name:'System', date: stamp.date, time: stamp.time });
    }
  });
  const updated = { ...existing, ...updates, edited: history.length>0 || existing.edited, editHistory: history };
  await dbPut('expenses', updated);
  const idx = STATE.cache.expenses.findIndex(x=>x.id===existing.id);
  if(idx>-1) STATE.cache.expenses[idx] = updated;
  await logAudit('Expense edited', existing.id, {fields: history.map(h=>h.field)});
  return updated;
}

/* ---------------------------- CALCULATOR ----------------------------
   Fully offline utility calculator. Its history is stored separately in the
   'calcHistory' IndexedDB store and NEVER touches Vargani/Expense/Balance data. */
const CALC = { display:'0', prevValue:null, operator:null, waitingForOperand:false, justEvaluated:false };
function calcFormatNumber(n){
  if(!isFinite(n)) return 'Error';
  let s = Number(n.toPrecision(12)).toString();
  if(s.length>15) s = Number(n).toExponential(6);
  return s;
}
function calcCompute(a,b,op){
  switch(op){
    case '+': return a+b;
    case '−': return a-b;
    case '×': return a*b;
    case '÷': if(b===0){ const e=new Error('DIV_ZERO'); throw e; } return a/b;
    default: return b;
  }
}
function calcRefreshDisplay(){
  const dispEl = document.getElementById('calcDisplay');
  const exprEl = document.getElementById('calcExpr');
  if(dispEl) dispEl.textContent = CALC.display;
  if(exprEl) exprEl.textContent = CALC.operator ? `${calcFormatNumber(CALC.prevValue)} ${CALC.operator}` : '';
}
function calcInputDigit(d){
  if(CALC.waitingForOperand || CALC.justEvaluated){
    CALC.display = d; CALC.waitingForOperand=false; CALC.justEvaluated=false;
  } else {
    CALC.display = CALC.display==='0' ? d : (CALC.display.replace('-','').length<15 ? CALC.display+d : CALC.display);
  }
  calcRefreshDisplay();
}
function calcInputDecimal(){
  if(CALC.waitingForOperand || CALC.justEvaluated){ CALC.display='0.'; CALC.waitingForOperand=false; CALC.justEvaluated=false; }
  else if(!CALC.display.includes('.')) CALC.display += '.';
  calcRefreshDisplay();
}
function calcClearAll(){
  CALC.display='0'; CALC.prevValue=null; CALC.operator=null; CALC.waitingForOperand=false; CALC.justEvaluated=false;
  calcRefreshDisplay();
}
function calcBackspace(){
  if(CALC.waitingForOperand || CALC.justEvaluated) return;
  CALC.display = CALC.display.length>1 ? CALC.display.slice(0,-1) : '0';
  calcRefreshDisplay();
}
function calcToggleSign(){
  if(CALC.display==='0') return;
  CALC.display = CALC.display.startsWith('-') ? CALC.display.slice(1) : ('-'+CALC.display);
  calcRefreshDisplay();
}
function calcShowDivZero(){
  toast('Cannot divide by zero.', 'err');
  CALC.display='0'; CALC.prevValue=null; CALC.operator=null; CALC.waitingForOperand=false; CALC.justEvaluated=false;
  calcRefreshDisplay();
}
function calcSetOperator(op){
  const inputValue = parseFloat(CALC.display);
  if(CALC.operator && !CALC.waitingForOperand){
    let result;
    try{ result = calcCompute(CALC.prevValue, inputValue, CALC.operator); }
    catch(e){ calcShowDivZero(); return; }
    CALC.display = calcFormatNumber(result);
    CALC.prevValue = result;
  } else {
    CALC.prevValue = inputValue;
  }
  CALC.operator = op;
  CALC.waitingForOperand = true;
  CALC.justEvaluated = false;
  calcRefreshDisplay();
}
async function calcEquals(){
  if(CALC.operator===null || CALC.prevValue===null) return;
  const inputValue = parseFloat(CALC.display);
  let result;
  try{ result = calcCompute(CALC.prevValue, inputValue, CALC.operator); }
  catch(e){ calcShowDivZero(); return; }
  const exprText = `${calcFormatNumber(CALC.prevValue)} ${CALC.operator} ${calcFormatNumber(inputValue)}`;
  await addCalcHistoryEntry(exprText, calcFormatNumber(result));
  CALC.display = calcFormatNumber(result);
  CALC.prevValue = null; CALC.operator = null; CALC.waitingForOperand = false; CALC.justEvaluated = true;
  calcRefreshDisplay();
  calcRefreshHistoryPanel();
}
async function calcPercent(){
  const inputValue = parseFloat(CALC.display);
  if(CALC.operator && CALC.prevValue!==null){
    // For + / − , "%" means a percentage OF the running total (e.g. 5000 + 10% = 5500).
    // For × / ÷ , "%" simply converts the number to a fraction (e.g. 5000 × 10% = 500).
    const percentAsValue = (CALC.operator==='+' || CALC.operator==='−')
      ? (CALC.prevValue * inputValue/100)
      : (inputValue/100);
    let result;
    try{ result = calcCompute(CALC.prevValue, percentAsValue, CALC.operator); }
    catch(e){ calcShowDivZero(); return; }
    const exprText = `${calcFormatNumber(CALC.prevValue)} ${CALC.operator} ${calcFormatNumber(inputValue)}%`;
    await addCalcHistoryEntry(exprText, calcFormatNumber(result));
    CALC.display = calcFormatNumber(result);
    CALC.prevValue=null; CALC.operator=null; CALC.waitingForOperand=false; CALC.justEvaluated=true;
  } else {
    CALC.display = calcFormatNumber(inputValue/100);
    CALC.justEvaluated = true;
  }
  calcRefreshDisplay();
  calcRefreshHistoryPanel();
}
async function addCalcHistoryEntry(expression, result){
  const entry = { id: uid('calc'), expression, result, ts: Date.now() };
  await dbPut('calcHistory', entry);
  STATE.cache.calcHistory.unshift(entry);
  if(STATE.cache.calcHistory.length>50){
    const removed = STATE.cache.calcHistory.pop();
    await dbDelete('calcHistory', removed.id);
  }
}
async function clearCalcHistory(){
  await dbClear('calcHistory');
  STATE.cache.calcHistory = [];
  calcRefreshHistoryPanel();
  toast('Calculator history cleared', 'ok');
}
function calcRefreshHistoryPanel(){
  const panel = document.getElementById('calcHistoryList');
  if(!panel) return;
  const items = STATE.cache.calcHistory || [];
  panel.innerHTML = items.length ? items.slice(0,20).map(h=>`
    <div class="calc-hist-row">
      <div class="ch-expr">${escapeHtml(h.expression)}</div>
      <div class="ch-res">= ${escapeHtml(h.result)}</div>
    </div>`).join('') : `<p class="muted center" style="padding:10px 0;font-size:12px;">No calculations yet.</p>`;
}
/* The calculator opens as a full centered overlay with NO backdrop-click-to-close, and it
   sits above the bottom nav (z-index), so accidental taps can't dismiss it or navigate away. */
function openCalculator(){
  calcClearAll();
  const root = document.getElementById('overlayRoot');
  const ov = document.createElement('div');
  ov.className = 'overlay center active';
  ov.id = 'calcOverlay';
  ov.innerHTML = `
    <div class="dialog calc-dialog">
      <div class="calc-header">
        <span>🧮 Calculator</span>
        <div>
          <button class="sheet-close" id="calcClearHist" title="Clear history" style="margin-right:6px;">🗑️</button>
          <button class="sheet-close" id="calcClose">✕</button>
        </div>
      </div>
      <div class="calc-screen">
        <div class="calc-expr" id="calcExpr"></div>
        <div class="calc-display" id="calcDisplay">0</div>
      </div>
      <div class="calc-history-panel" id="calcHistoryList"></div>
      <div class="calc-pad">
        <button class="calc-btn calc-fn" data-c="AC">AC</button>
        <button class="calc-btn calc-fn" data-c="back">⌫</button>
        <button class="calc-btn calc-fn" data-c="%">%</button>
        <button class="calc-btn calc-op" data-c="÷">÷</button>

        <button class="calc-btn" data-c="7">7</button>
        <button class="calc-btn" data-c="8">8</button>
        <button class="calc-btn" data-c="9">9</button>
        <button class="calc-btn calc-op" data-c="×">×</button>

        <button class="calc-btn" data-c="4">4</button>
        <button class="calc-btn" data-c="5">5</button>
        <button class="calc-btn" data-c="6">6</button>
        <button class="calc-btn calc-op" data-c="−">−</button>

        <button class="calc-btn" data-c="1">1</button>
        <button class="calc-btn" data-c="2">2</button>
        <button class="calc-btn" data-c="3">3</button>
        <button class="calc-btn calc-op" data-c="+">+</button>

        <button class="calc-btn" data-c="+/-">±</button>
        <button class="calc-btn" data-c="0">0</button>
        <button class="calc-btn" data-c=".">.</button>
        <button class="calc-btn calc-eq" data-c="=">=</button>
      </div>
    </div>
  `;
  root.appendChild(ov);
  document.getElementById('calcClose').addEventListener('click', ()=>ov.remove());
  document.getElementById('calcClearHist').addEventListener('click', clearCalcHistory);
  ov.querySelectorAll('.calc-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const c = btn.dataset.c;
      if(/^[0-9]$/.test(c)) calcInputDigit(c);
      else if(c==='.') calcInputDecimal();
      else if(c==='AC') calcClearAll();
      else if(c==='back') calcBackspace();
      else if(c==='+/-') calcToggleSign();
      else if(c==='%') await calcPercent();
      else if(c==='=') await calcEquals();
      else calcSetOperator(c);
    });
  });
  calcRefreshDisplay();
  calcRefreshHistoryPanel();
}

/* Steps 1-6 of the safe restore workflow: read, decrypt if needed, validate structure —
   all BEFORE anything in the database is touched. */
async function runRestorePreview(text, password){
  let payload;

    payload = await readAndValidateBackup(text, password);
  }catch(err){
    if(err.message === 'PASSWORD_REQUIRED'){ openRestorePasswordPrompt(text); return; }
    toast(err.message || 'Restore failed. Your existing data has not been changed.', 'err');

async function handleImportFile(e){

/* ---------------------------- PIN / LOCK SCREENS ----------------------------
   PIN policy: new/changed PINs are 6 digits (stronger). Existing 4-digit PINs from
   before this update keep working unchanged — we compare the SHA-256 hash of whatever
   the user typed, whatever its length, against the stored hash, so no migration is
   required and nobody is locked out. */
function pinPadInnerHtml(mode){
  // mode: 'set' (fixed-length, auto-submits) | 'login' (variable 4-6 length, explicit submit button)
  return `
    <div class="pin-dots" id="pinDots">${[0,1,2,3,4,5].map(()=>`<div class="pin-dot"></div>`).join('')}</div>
    <div class="pin-pad" id="pinPad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="pin-key" data-k="${n}">${n}</button>`).join('')}
      <button type="button" class="pin-key fn" data-k="clear">Clear</button>
      <button type="button" class="pin-key" data-k="0">0</button>
      <button type="button" class="pin-key fn" data-k="back">⌫</button>
    </div>
    ${mode==='login' ? `<button type="button" class="btn btn-primary" id="pinEnterBtn" style="margin-top:16px;" disabled>${t('login')} ✓</button>` : ''}
  `;
}
function pinScreenHtml(title, sub, isLockScreen, opts){
  opts = opts || {};
  const wrapOpen = isLockScreen ? `<div class="lock-screen">` : `<div class="screens" style="padding-top:60px;">`;
  const wrapClose = `</div>`;
  const inner = `
    <div class="${isLockScreen?'':'card center'}">
      <div class="${isLockScreen?'li':''}" style="${isLockScreen?'':'font-size:34px;'}">🔐</div>
      <h2 style="${isLockScreen?'color:#fff;':''}margin-top:6px;">${title}</h2>
      <p class="${isLockScreen?'sub':'muted'}" style="margin-top:4px;">${sub}</p>
      ${pinPadInnerHtml(opts.mode || 'set')}
    </div>
  `;
  return wrapOpen + inner + wrapClose;
}
/* opts: {mode:'set'|'login', exactLen, minLen, maxLen}
   'set'   -> requires exactLen digits, auto-submits the moment that length is reached.
   'login' -> accepts minLen..maxLen digits; user must tap the Enter/Unlock button to submit
              (needed because we don't know in advance whether an existing PIN is 4 or 6 digits). */
function wirePinPad(onComplete, opts){
  opts = opts || {};
  const mode = opts.mode || 'set';
  const exactLen = opts.exactLen || 6;
  const minLen = opts.minLen || 4;
  const maxLen = opts.maxLen || 6;
  const pad = document.getElementById('pinPad');
  const dotsWrap = document.getElementById('pinDots');
  const enterBtn = document.getElementById('pinEnterBtn');
  function refreshDots(){
    dotsWrap.querySelectorAll('.pin-dot').forEach((d,i)=>{
      d.classList.toggle('filled', i < STATE.pinBuffer.length);
    });
    if(enterBtn) enterBtn.disabled = STATE.pinBuffer.length < minLen;
  }
  refreshDots();
  pad.querySelectorAll('.pin-key').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.k;
      if(k==='clear'){ STATE.pinBuffer=''; refreshDots(); return; }
      if(k==='back'){ STATE.pinBuffer = STATE.pinBuffer.slice(0,-1); refreshDots(); return; }
      if(STATE.pinBuffer.length>=maxLen) return;
      STATE.pinBuffer += k;
      refreshDots();
      if(mode==='set' && STATE.pinBuffer.length===exactLen){
        const pin = STATE.pinBuffer;
        setTimeout(()=>onComplete(pin), 120);
      }
    });
  });
  if(enterBtn){
    enterBtn.addEventListener('click', ()=>{
      if(STATE.pinBuffer.length < minLen) return;
      onComplete(STATE.pinBuffer);
    });
  }
}
function renderLockoutCountdown(app){
  function render(){
    const secs = lockoutRemainingSeconds();
    if(secs<=0){
      if(STATE.lockoutIntervalId){ clearInterval(STATE.lockoutIntervalId); STATE.lockoutIntervalId=null; }
      showLockScreen();
      return;
    }
    app.innerHTML = `
      <div class="lock-screen">
        <div class="li">⏳</div>
        <h2>Too Many Attempts</h2>
        <p class="sub">For security, login is temporarily locked.<br>Try again in <b>${secs}s</b>.</p>
      </div>`;
  }
  render();
  STATE.lockoutIntervalId = setInterval(render, 1000);
}
function showLockScreen(){
  STATE.locked = true;
  STATE.pinBuffer = '';
  if(STATE.lockoutIntervalId){ clearInterval(STATE.lockoutIntervalId); STATE.lockoutIntervalId=null; }
  const app = document.getElementById('app');
  if(isLockedOut()){
    renderLockoutCountdown(app);
    return;
  }
  app.innerHTML = pinScreenHtml(t('enterPin'), STATE.mandal ? STATE.mandal.name : '', true, {mode:'login'});
  wirePinPad(async (pin)=>{
    const hash = await sha256Hex(pin);
    const match = STATE.cache.users.find(u=>u.pinHash===hash);
    if(match){
      await registerSuccessfulLogin();
      STATE.currentUser = match;
      STATE.locked = false;
      STATE.lastActivity = Date.now();
      await logAudit('Login', match.id, {role: match.role});
      toast('Welcome, '+match.name, 'ok');
      renderShell();
      navigateTo('dashboard');
    } else {
      await registerFailedAttempt();
      await logAudit('Failed login', '', {});
      STATE.pinBuffer = '';
      if(isLockedOut()){
        toast('Too many attempts. Login is temporarily locked.', 'err');
      } else {
        const usedThisCycle = STATE.security.failedAttempts % 5;
        const remaining = 5 - usedThisCycle;
        toast(t('wrongPin') + ` (${remaining} attempt${remaining===1?'':'s'} left)`, 'err');
      }
      showLockScreen();
    }
  }, {mode:'login', minLen:4, maxLen:6});
}

}

    <div class="sheet-handle"></div>
    <div class="sheet-head"><h3>New PIN</h3><button class="sheet-close" id="npClose">✕</button></div>
    <p class="muted" style="margin-bottom:14px;">Enter a new 6-digit PIN.</p>
    ${pinPadInnerHtml('set')}
  `;
  const ov = openSheet(html, {noBackdropClose:true});
  ov.querySelector('#npClose').addEventListener('click', closeSheet);
  wirePinPad(async (pin)=>{
    const hash = await sha256Hex(pin);
    const updated = { ...STATE.currentUser, pinHash: hash };
    await dbPut('users', updated);
    const idx = STATE.cache.users.findIndex(u=>u.id===updated.id);
    if(idx>-1) STATE.cache.users[idx] = updated;
    STATE.currentUser = updated;
    await logAudit('PIN changed', updated.id, {});
    closeSheet();
    toast('PIN updated successfully', 'ok');
  }, {mode:'set', exactLen:6, maxLen:6, minLen:6});
}
/* President-only: reset another user's PIN (does not require knowing their old PIN). */
function openResetUserPinFlow(user){
  if(!requirePresident('reset PIN')) return;
  STATE.pinBuffer = '';
  const html = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h3>Reset PIN — ${escapeHtml(user.name)}</h3><button class="sheet-close" id="rpClose">✕</button></div>
    <p class="muted" style="margin-bottom:14px;">Set a new 6-digit PIN for this user.</p>
    ${pinPadInnerHtml('set')}
  `;
  const ov = openSheet(html, {noBackdropClose:true});
  ov.querySelector('#rpClose').addEventListener('click', closeSheet);
  wirePinPad(async (pin)=>{
    if(!requirePresident('reset PIN')){ closeSheet(); return; }
    const hash = await sha256Hex(pin);
    const updated = { ...user, pinHash: hash };
    await dbPut('users', updated);
    const idx = STATE.cache.users.findIndex(u=>u.id===user.id);
    if(idx>-1) STATE.cache.users[idx] = updated;
    if(STATE.currentUser.id===user.id) STATE.currentUser = updated;
    await logAudit('PIN changed', user.id, {resetBy: STATE.currentUser.name});
    closeSheet();
    toast('PIN reset for '+user.name, 'ok');
  }, {mode:'set', exactLen:6, maxLen:6, minLen:6});
}

/* ---------------------------- AUTO-LOCK / ACTIVITY ---------------------------- */
function trackActivity(){
  STATE.lastActivity = Date.now();
}
['click','touchstart','keydown','scroll'].forEach(evt=>{
  document.addEventListener(evt, trackActivity, {passive:true});
});
setInterval(()=>{
  if(STATE.locked) return;
  if(!STATE.mandal || !STATE.currentUser) return;
  const mins = (Date.now() - STATE.lastActivity) / 60000;
  if(STATE.autoLockMinutes>0 && mins >= STATE.autoLockMinutes){
    lockApp();
  }
}, 15000);

/* ---------------------------- INIT / BOOT ---------------------------- */
async function boot(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
  if(!STATE.mandal){
    renderSetupWizard();
    return;
  }
  if(!STATE.cache.users.length){
    // Mandal exists but no users (edge case) — force setup of an owner user.
    STATE._setupData = {
      id: STATE.mandal.id, name: STATE.mandal.name, village: STATE.mandal.village, district: STATE.mandal.district,
      year: STATE.mandal.year, president: STATE.mandal.president, vp: STATE.mandal.vp, secretary: STATE.mandal.secretary,
      treasurer: STATE.mandal.treasurer, contact: STATE.mandal.contact||'', pledgedTotal: STATE.mandal.pledgedTotal||0
    };
    renderSetupRoleStep();
    return;
  }
  if(!STATE.currentUser){
    showLockScreen();
    return;
  }
  document.documentElement.setAttribute('data-theme', STATE.theme);
  renderShell();
  navigateTo('dashboard');
}
async function init(){
  try{
    STATE.db = await openDatabase();
    await loadAllData();
    document.documentElement.setAttribute('data-theme', STATE.theme);
    // boot() already handles every case (no mandal / no users / not logged in / ready) —
    // avoid duplicating that branching logic here.
    boot();
  }catch(err){
    console.error('DB init failed', err);
    document.getElementById('app').innerHTML = `
      <div class="screens" style="padding-top:80px;">
        <div class="card center">
          <div style="font-size:36px;">⚠️</div>
          <h2>Storage unavailable</h2>
          <p class="muted">MandalSetu needs IndexedDB to store your mandal's data securely. Please use a modern browser (Chrome, Firefox, Edge) with storage enabled, and try again.</p>
        </div>
      </div>`;
  }
}
window.addEventListener('DOMContentLoaded', init);
</script>
